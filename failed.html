<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Cancelación de Pago</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #212121;
            --secondary-bg: #191919;
            --text-color: #ffffff;
            --accent-color: #FF5722;
            --card-bg: rgba(255, 255, 255, 0.05);
            --hover-color: #FF7043;
        }
        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background: linear-gradient(135deg, var(--primary-bg), var(--secondary-bg));
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }
        .container:hover {
            transform: translateY(-5px);
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 87, 34, 0.5);
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }
        h1::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-color);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        .container:hover h1::after {
            transform: scaleX(1);
        }
        .confirmation-box {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: background-color 0.3s ease;
        }
        .confirmation-box:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .emoji {
            font-size: 4em;
            margin-bottom: 20px;
            animation: shake 0.82s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: var(--secondary-bg);
            border-radius: 5px;
            margin-bottom: 30px;
            overflow: hidden;
            position: relative;
        }
        .progress {
            width: 100%;
            height: 100%;
            background-color: var(--accent-color);
            animation: cancelProgress 1.5s ease-out forwards;
        }
        @keyframes cancelProgress {
            0% { width: 100%; }
            100% { width: 0%; }
        }
        .details {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            transition: box-shadow 0.3s ease;
        }
        .details:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .detail-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        .cta-button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--accent-color);
            color: var(--text-color);
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .cta-button:hover {
            background-color: var(--hover-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .cta-button::after {
            content: '→';
            position: absolute;
            top: 50%;
            right: -20px;
            transform: translateY(-50%);
            opacity: 0;
            transition: all 0.3s ease;
        }
        .cta-button:hover::after {
            right: 15px;
            opacity: 1;
        }
        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.6);
        }
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.5em;
            }
            .emoji {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo" role="img" aria-label="Logo de MiEmpresa">FilmsGapsPlus</div>
        </header>

        <main>
            <h1>Pago Cancelado</h1>
            
            <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                <div class="progress"></div>
            </div>

            <div class="confirmation-box">
                <div class="emoji" role="img" aria-label="Pago Cancelado">❌</div>
                <p>El pago del paquete Premium ha sido cancelado.</p>
            </div>

            <div class="details">
                <div class="detail-item">
                    <span>Paquete:</span>
                    <strong>Premium (No adquirido)</strong>
                </div>
                <div class="detail-item">
                    <span>Estado:</span>
                    <strong>Cancelado</strong>
                </div>
                <div class="detail-item">
                    <span>Fecha de cancelación:</span>
                    <strong id="cancellation-date"></strong>
                </div>
            </div>

            <p>Lamentamos que hayas cancelado tu compra. Si tienes alguna pregunta o necesitas ayuda, no dudes en contactarnos.</p>

            
        </main>
    </div>

    

    <script>
        document.getElementById('cancellation-date').textContent = new Date().toLocaleDateString();
        
        // Add focus styles for keyboard navigation
        const interactiveElements = document.querySelectorAll('a, button, [tabindex]');
        interactiveElements.forEach(el => {
            el.addEventListener('focus', () => el.style.outline = '2px solid var(--accent-color)');
            el.addEventListener('blur', () => el.style.outline = 'none');
        });
    </script>
</body>
  </html>
